<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0HHE6C7WWG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0HHE6C7WWG');
    </script>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/favicon-192x192.png">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body>
    <!-- Restore deep links after GitHub Pages 404.html redirect (/?/careers → /careers) -->
    <script type="text/javascript">
      (function (locationRef) {
        if (locationRef.search[1] === '/') {
          var decoded = locationRef.search.slice(1).split('&').map(function (part) {
            return part.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, decoded + locationRef.hash)
        }
      }(window.location))
    </script>
    <!-- quasar:entry-point -->
  </body>
</html>
