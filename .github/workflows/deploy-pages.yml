# Production build for GitHub Pages (docs/).
# Required repository secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (Supabase env baked into bundle)
        run: npm run build
        env:
          CI: 'true'
          REQUIRE_SUPABASE_ENV: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Commit docs/ for GitHub Pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(pages): rebuild site with Supabase configuration'
          file_pattern: docs/**
