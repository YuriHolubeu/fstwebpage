# Optional: manual production rebuild. Normal deploys use committed docs/ + GitHub Pages.
#
# To run: GitHub → Actions → Deploy GitHub Pages → Run workflow
# Add repository secrets first: VITE_API_BASE_URL
name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (API env baked into bundle)
        run: npm run build
        env:
          CI: 'true'
          REQUIRE_API_ENV: '1'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Commit docs/ for GitHub Pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(pages): rebuild site with API configuration'
          file_pattern: docs/**
